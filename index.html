<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Download App</title>

  <meta name="description" content="Download the latest version of the app." />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f7;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      text-align: center;
      padding: 30px;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 32px;
      color: #111;
    }

    p {
      margin-bottom: 30px;
      color: #666;
      font-size: 16px;
    }

    .download-button {
      display: inline-block;
      padding: 16px 32px;
      background: #111;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .download-button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .download-button:active {
      transform: translateY(0);
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Download App</h1>

    <p>Download the latest Android version.</p>

    <a class="download-button" href="./smarttube.apk" download>
      Download APK
    </a>

  </div>

</body>
</html>
